<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransitOps | Smart Transport Operations</title>
  <style>
    :root{--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--line:#263650;--text:#eef6ff;--muted:#9aabc1;--brand:#19e6af;--blue:#5da9ff;--danger:#ff6b7a;--warn:#ffc857;--shadow:0 18px 45px #02061770}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#173764 0,#0b1220 38%);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
    .hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:#111c2ee6;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.brand{text-align:center;margin-bottom:26px}.brand .mark{font-size:42px}.brand h1{margin:4px 0;color:var(--brand)}.brand p,.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:600;color:#d9e5f3}.field input,.field select{width:100%;background:#0b1424;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}.primary{background:var(--brand);color:#062119;font-weight:800;border-radius:10px;padding:12px 16px}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.danger{background:#562131;color:#ffd8dd}.full{width:100%;margin-top:12px}.demo{margin-top:20px;padding:13px;border-radius:12px;background:#0b1424;color:var(--muted);font-size:12px}.error{min-height:20px;color:var(--danger);font-weight:600;margin-top:8px}
    .app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#0d1728;border-right:1px solid var(--line);padding:22px 16px;z-index:3}.side-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 25px}.side-brand .mark{font-size:28px}.side-brand strong{font-size:20px;color:var(--brand)}.nav{display:grid;gap:6px}.nav button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:transparent;color:var(--muted);border-radius:10px}.nav button:hover,.nav button.active{background:#18334a;color:var(--brand)}.main{margin-left:250px;padding:28px;max-width:1600px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.topbar p{margin:5px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.avatar{background:#18334a;color:var(--brand);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:800}.view{display:none}.view.active{display:block}.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(7,minmax(130px,1fr));margin-bottom:20px}.card,.panel{background:linear-gradient(145deg,#142239,#101b2c);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.kpi-label{color:var(--muted);font-size:12px}.kpi{font-size:26px;font-weight:800;margin-top:7px;color:var(--brand)}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}.panel{padding:20px}.panel h2,.panel h3{margin:0 0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}.toolbar .field{margin:0;min-width:150px;flex:1}.toolbar .field.small{flex:0 1 180px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th{background:#1a3150;color:#bfe0ff;text-align:left;font-size:12px;padding:12px}.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#25334a;color:#cbd8e8}.badge.good{background:#0c473c;color:#7ff5d1}.badge.warn{background:#503d0b;color:#ffd978}.badge.bad{background:#511d2b;color:#ff9fac}.badge.info{background:#123d6d;color:#a7d3ff}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 9px;border-radius:7px;background:#22324b;color:#cfe1f5}.empty{text-align:center;padding:30px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-grid .wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.notice{padding:12px;border-radius:10px;background:#11364b;color:#bde5ff;margin-bottom:16px}.chart{width:100%;height:220px;display:block}.bar-row{display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:10px;margin:13px 0;color:var(--muted)}.bar{height:10px;background:#253650;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--brand));border-radius:20px}.split{display:flex;justify-content:space-between;gap:10px}.list{display:grid;gap:10px}.list-item{padding:12px;border:1px solid var(--line);border-radius:10px;color:#dce9f7}.list-item small{display:block;color:var(--muted);margin-top:3px}
    .modal{position:fixed;inset:0;background:#020617aa;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111c2e;border:1px solid var(--line);border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{background:transparent;color:var(--muted);font-size:24px}.toast{position:fixed;right:22px;bottom:22px;padding:13px 16px;border-radius:10px;background:#0c473c;color:#9ff5dc;z-index:20;box-shadow:var(--shadow)}
    @media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(max-width:850px){.sidebar{position:static;width:100%;height:auto;padding:12px}.side-brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{margin-left:0;padding:18px}.two,.three{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.top-actions .role-name{display:none}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.topbar h1{font-size:22px}.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <section id="login" class="auth">
    <div class="auth-card">
      <div class="brand"><div class="mark">🚍</div><h1>TransitOps</h1><p>Smart Transport Operations Platform</p></div>
      <form id="loginForm">
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required value="manager@transitops.com" autocomplete="username"></div>
        <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required value="12345" autocomplete="current-password"></div>
        <div class="field"><label for="loginRole">Role</label><select id="loginRole"><option>Fleet Manager</option><option>Dispatcher</option><option>Safety Officer</option><option>Financial Analyst</option></select></div>
        <button class="primary full">Sign in</button><div id="loginError" class="error"></div>
      </form>
      <div class="demo">Demo access: any listed role with password <b>12345</b>. Data is saved in this browser using localStorage.</div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside class="sidebar"><div class="side-brand"><span class="mark">🚍</span><strong>TransitOps</strong></div><nav id="nav" class="nav"></nav></aside>
    <main class="main"><div class="topbar"><div><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div><div class="top-actions"><span id="roleName" class="muted role-name"></span><span id="avatar" class="avatar"></span><button id="logout" class="secondary">Log out</button></div></div><div id="views"></div></main>
  </section>
  <div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>

  <script>
    const KEY='transitops-data-v1', SESSION='transitops-session-v1';
    const roles=['Fleet Manager','Dispatcher','Safety Officer','Financial Analyst'];
    const permissions={
      'Fleet Manager':['dashboard','vehicles','drivers','trips','maintenance','finance','reports','settings'],
      'Dispatcher':['dashboard','vehicles','drivers','trips'],
      'Safety Officer':['dashboard','vehicles','drivers','maintenance'],
      'Financial Analyst':['dashboard','vehicles','maintenance','finance','reports']
    };
    const navItems=[['dashboard','📊','Dashboard'],['vehicles','🚍','Vehicles'],['drivers','👨‍✈️','Drivers'],['trips','🗺','Trips'],['maintenance','🔧','Maintenance'],['finance','⛽','Fuel & Expenses'],['reports','📈','Reports'],['settings','⚙','Settings']];
    const seed={vehicles:[
      {id:'v1',reg:'TS 08 HK 2058',model:'Ashok Leyland Viking',type:'Bus',capacity:5000,odometer:84500,acquisition:3200000,status:'On Trip',region:'Hyderabad'},
      {id:'v2',reg:'AP 09 XY 4521',model:'Tata 407',type:'Truck',capacity:5000,odometer:62400,acquisition:1800000,status:'Available',region:'Vijayawada'},
      {id:'v3',reg:'TS 10 AB 7788',model:'Van-05',type:'Van',capacity:500,odometer:12400,acquisition:850000,status:'Available',region:'Hyderabad'},
      {id:'v4',reg:'KA 01 MN 1212',model:'Eicher Pro',type:'Truck',capacity:9000,odometer:110200,acquisition:2800000,status:'In Shop',region:'Bengaluru'}],
      drivers:[
      {id:'d1',name:'Ramesh Kumar',license:'TS12345678',category:'Heavy Vehicle',expiry:'2027-11-30',phone:'9876543210',score:96,status:'On Trip'},
      {id:'d2',name:'Suresh Rao',license:'TS56874512',category:'Heavy Vehicle',expiry:'2027-08-15',phone:'9988776655',score:92,status:'Available'},
      {id:'d3',name:'Mahesh Kumar',license:'TS47896521',category:'Light Vehicle',expiry:'2026-09-05',phone:'9000011111',score:88,status:'Available'},
      {id:'d4',name:'Alex Johnson',license:'DL99887766',category:'Light Vehicle',expiry:'2028-03-20',phone:'9000099999',score:94,status:'Off Duty'}],
      trips:[{id:'t1',vehicleId:'v1',driverId:'d1',source:'Hyderabad',destination:'Vijayawada',cargo:'Passengers',weight:3500,distance:275,date:'2026-08-30',status:'Dispatched',fuel:38,revenue:28000}],
      maintenance:[{id:'m1',vehicleId:'v4',issue:'Brake inspection',cost:18000,date:'2026-08-29',status:'In Progress'}],
      fuels:[{id:'f1',vehicleId:'v1',litres:38,cost:3800,date:'2026-08-30',type:'Diesel'}],expenses:[{id:'e1',vehicleId:'v1',type:'Toll',amount:1200,date:'2026-08-30'}]};
    let db=load(), session=JSON.parse(localStorage.getItem(SESSION)||'null'), current='dashboard';
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
    function save(){localStorage.setItem(KEY,JSON.stringify(db))} function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})} function isExpired(d){return new Date(d+'T23:59:59')<new Date()}
    function badge(s){let c=['Available','Completed','Closed'].includes(s)?'good':['In Shop','In Progress','Pending','Off Duty'].includes(s)?'warn':['Cancelled','Suspended','Retired'].includes(s)?'bad':'info';return `<span class="badge ${c}">${esc(s)}</span>`}
    function can(k){return permissions[session?.role]?.includes(k)}
    function notify(msg,good=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=good?'#0c473c':'#511d2b';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
    function setTitle(title,sub){document.getElementById('pageTitle').textContent=title;document.getElementById('pageSubtitle').textContent=sub;document.getElementById('roleName').textContent=session.role;document.getElementById('avatar').textContent=session.email[0].toUpperCase()}
    function init(){if(!session){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('nav').innerHTML=navItems.filter(x=>can(x[0])).map(x=>`<button data-view="${x[0]}">${x[1]} ${x[2]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>route(b.dataset.view));route(can(current)?current:'dashboard')}
    function route(view){current=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const v=document.getElementById('views');v.innerHTML=render(view);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action,b.dataset.id));bind(view)}
    function render(view){return ({dashboard:renderDashboard,vehicles:renderVehicles,drivers:renderDrivers,trips:renderTrips,maintenance:renderMaintenance,finance:renderFinance,reports:renderReports,settings:renderSettings}[view]||renderDashboard)()}
    function renderDashboard(){setTitle('Operations dashboard','Real-time fleet health and activity');const active=db.vehicles.filter(v=>v.status==='On Trip').length, available=db.vehicles.filter(v=>v.status==='Available').length, shop=db.vehicles.filter(v=>v.status==='In Shop').length, trips=db.trips.filter(t=>t.status==='Dispatched').length, pending=db.trips.filter(t=>t.status==='Draft').length, duty=db.drivers.filter(d=>d.status==='On Trip').length;return `<section class="grid kpis"><div class="card"><div class="kpi-label">Active Vehicles</div><div class="kpi">${active}</div></div><div class="card"><div class="kpi-label">Available Vehicles</div><div class="kpi">${available}</div></div><div class="card"><div class="kpi-label">In Maintenance</div><div class="kpi">${shop}</div></div><div class="card"><div class="kpi-label">Active Trips</div><div class="kpi">${trips}</div></div><div class="card"><div class="kpi-label">Pending Trips</div><div class="kpi">${pending}</div></div><div class="card"><div class="kpi-label">Drivers On Duty</div><div class="kpi">${duty}</div></div><div class="card"><div class="kpi-label">Fleet Utilization</div><div class="kpi">${db.vehicles.length?Math.round(active/db.vehicles.length*100):0}%</div></div></section><section class="grid two"><div class="panel"><h2>Fleet by status</h2>${['Available','On Trip','In Shop','Retired'].map(s=>{let n=db.vehicles.filter(v=>v.status===s).length;return `<div class="bar-row"><span>${s}</span><div class="bar"><i style="width:${db.vehicles.length?n/db.vehicles.length*100:0}%"></i></div><b>${n}</b></div>`}).join('')}</div><div class="panel"><h2>Recent activity</h2><div class="list">${db.trips.slice(-3).reverse().map(t=>`<div class="list-item">${badge(t.status)} Trip: ${esc(t.source)} → ${esc(t.destination)}<small>${esc(db.vehicles.find(v=>v.id===t.vehicleId)?.reg||'')}</small></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div></section>`}
    function renderVehicles(){setTitle('Vehicle registry','Manage fleet assets, capacity, odometers, and lifecycle status');return `<section class="panel"><div class="toolbar"><div class="field small"><label>Search</label><input id="vehicleSearch" placeholder="Registration or model"></div><div class="field small"><label>Type</label><select id="vehicleType"><option value="">All types</option><option>Bus</option><option>Truck</option><option>Van</option></select></div><div class="field small"><label>Status</label><select id="vehicleStatus"><option value="">All statuses</option>${['Available','On Trip','In Shop','Retired'].map(x=>`<option>${x}</option>`).join('')}</select></div>${can('vehicles')?'<button class="primary" data-action="vehicle-add">+ Add vehicle</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Registration</th><th>Model / type</th><th>Capacity</th><th>Odometer</th><th>Acquisition</th><th>Status</th><th></th></tr></thead><tbody id="vehicleRows">${vehicleRows(db.vehicles)}</tbody></table></div></section>`}
    function vehicleRows(rows){return rows.map(v=>`<tr><td><b>${esc(v.reg)}</b><br><small class="muted">${esc(v.region)}</small></td><td>${esc(v.model)}<br><small class="muted">${esc(v.type)}</small></td><td>${Number(v.capacity).toLocaleString()} kg</td><td>${Number(v.odometer).toLocaleString()} km</td><td>${money(v.acquisition)}</td><td>${badge(v.status)}</td><td class="actions">${can('vehicles')?`<button data-action="vehicle-edit" data-id="${v.id}">Edit</button>`:''}${can('vehicles')&&v.status!=='Retired'?`<button data-action="vehicle-retire" data-id="${v.id}">Retire</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No vehicles found.</td></tr>'}
    function renderDrivers(){setTitle('Driver management','Compliance, license validity, and safety records');return `<section class="panel"><div class="toolbar"><div class="field small"><label>Search</label><input id="driverSearch" placeholder="Name or license"></div><div class="field small"><label>Status</label><select id="driverStatus"><option value="">All statuses</option>${['Available','On Trip','Off Duty','Suspended'].map(x=>`<option>${x}</option>`).join('')}</select></div>${can('drivers')?'<button class="primary" data-action="driver-add">+ Add driver</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>License</th><th>Expiry</th><th>Contact</th><th>Safety</th><th>Status</th><th></th></tr></thead><tbody id="driverRows">${driverRows(db.drivers)}</tbody></table></div></section>`}
    function driverRows(rows){return rows.map(d=>{let expired=isExpired(d.expiry);return `<tr><td><b>${esc(d.name)}</b><br><small class="muted">${esc(d.category)}</small></td><td>${esc(d.license)}</td><td>${esc(d.expiry)} ${expired?badge('Expired'):''}</td><td>${esc(d.phone)}</td><td>${esc(d.score)}%</td><td>${badge(d.status)}</td><td class="actions">${can('drivers')?`<button data-action="driver-edit" data-id="${d.id}">Edit</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No drivers found.</td></tr>'}
    function renderTrips(){setTitle('Trip dispatcher','Create, dispatch, complete, or cancel trips with business-rule validation');const vehicleOptions=db.vehicles.filter(v=>v.status==='Available').map(v=>`<option value="${v.id}">${esc(v.reg)} - ${esc(v.model)} (${v.capacity} kg)</option>`).join('');const driverOptions=db.drivers.filter(d=>d.status==='Available'&&!isExpired(d.expiry)).map(d=>`<option value="${d.id}">${esc(d.name)} - ${esc(d.license)}</option>`).join('');return `<section class="grid two"><div class="panel"><h2>Create trip</h2><div class="notice">Only Available vehicles and drivers with valid licenses can be assigned. Cargo weight cannot exceed vehicle capacity.</div><form id="tripForm" class="form-grid"><div class="field"><label>Vehicle</label><select name="vehicleId" required>${vehicleOptions||'<option value="">No eligible vehicles</option>'}</select></div><div class="field"><label>Driver</label><select name="driverId" required>${driverOptions||'<option value="">No eligible drivers</option>'}</select></div><div class="field"><label>Source</label><input name="source" required placeholder="Hyderabad"></div><div class="field"><label>Destination</label><input name="destination" required placeholder="Vijayawada"></div><div class="field"><label>Cargo type</label><select name="cargo"><option>Passengers</option><option>Food</option><option>Electronics</option><option>Medical Supplies</option></select></div><div class="field"><label>Cargo weight (kg)</label><input name="weight" type="number" min="0" required></div><div class="field"><label>Planned distance (km)</label><input name="distance" type="number" min="1" required></div><div class="field"><label>Trip date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="form-actions wide"><button class="primary">Dispatch trip</button></div></form></div><div class="panel"><h2>Trip lifecycle</h2><div class="list">${db.trips.slice().reverse().map(t=>{let v=db.vehicles.find(x=>x.id===t.vehicleId),d=db.drivers.find(x=>x.id===t.driverId);return `<div class="list-item"><div class="split"><b>${esc(t.source)} → ${esc(t.destination)}</b>${badge(t.status)}</div><small>${esc(v?.reg||'')} · ${esc(d?.name||'')} · ${t.weight} kg · ${t.distance} km</small><div class="actions" style="margin-top:8px">${t.status==='Dispatched'?`<button data-action="trip-complete" data-id="${t.id}">Complete</button><button data-action="trip-cancel" data-id="${t.id}" class="danger">Cancel</button>`:''}</div></div>`}).join('')||'<div class="empty">No trips created.</div>'}</div></div></section>`}
    function renderMaintenance(){setTitle('Maintenance','Keep vehicles safe and automatically remove active repairs from dispatch');return `<section class="grid two"><div class="panel"><h2>New maintenance record</h2><form id="maintenanceForm" class="form-grid"><div class="field"><label>Vehicle</label><select name="vehicleId" required>${db.vehicles.filter(v=>v.status!=='Retired').map(v=>`<option value="${v.id}">${esc(v.reg)} (${esc(v.status)})</option>`).join('')}</select></div><div class="field"><label>Issue / service</label><input name="issue" required placeholder="Oil change"></div><div class="field"><label>Estimated cost (₹)</label><input name="cost" type="number" min="0" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="form-actions wide"><button class="primary">Start maintenance</button></div></form></div><div class="panel"><h2>Maintenance log</h2><div class="list">${db.maintenance.slice().reverse().map(m=>{let v=db.vehicles.find(x=>x.id===m.vehicleId);return `<div class="list-item"><div class="split"><b>${esc(v?.reg||'Unknown')}</b>${badge(m.status)}</div><small>${esc(m.issue)} · ${money(m.cost)} · ${esc(m.date)}</small>${m.status==='In Progress'?`<div class="actions" style="margin-top:8px"><button data-action="maintenance-close" data-id="${m.id}">Close maintenance</button></div>`:''}</div>`}).join('')||'<div class="empty">No maintenance records.</div>'}</div></div></section>`}
    function renderFinance(){setTitle('Fuel & expenses','Capture operating costs and review per-vehicle totals');return `<section class="grid two"><div class="panel"><h2>Record fuel or expense</h2><form id="financeForm" class="form-grid"><div class="field"><label>Record type</label><select name="kind"><option value="fuel">Fuel log</option><option value="expense">Other expense</option></select></div><div class="field"><label>Vehicle</label><select name="vehicleId">${db.vehicles.map(v=>`<option value="${v.id}">${esc(v.reg)}</option>`).join('')}</select></div><div class="field"><label>Amount / fuel cost (₹)</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Fuel litres (fuel only)</label><input name="litres" type="number" min="0" step="0.1"></div><div class="field"><label>Category (expense only)</label><input name="type" placeholder="Toll, insurance..."></div><div class="form-actions wide"><button class="primary">Save record</button></div></form></div><div class="panel"><h2>Cost summary</h2>${db.vehicles.map(v=>{let fuel=db.fuels.filter(x=>x.vehicleId===v.id).reduce((a,x)=>a+Number(x.cost),0),maint=db.maintenance.filter(x=>x.vehicleId===v.id).reduce((a,x)=>a+Number(x.cost),0),other=db.expenses.filter(x=>x.vehicleId===v.id).reduce((a,x)=>a+Number(x.amount),0);return `<div class="list-item" style="margin-bottom:10px"><div class="split"><b>${esc(v.reg)}</b><b>${money(fuel+maint+other)}</b></div><small>Fuel ${money(fuel)} · Maintenance ${money(maint)} · Other ${money(other)}</small></div>`}).join('')}</div></section>`}
    function renderReports(){setTitle('Reports & analytics','Operational cost, efficiency, utilization, and ROI');let totalFuel=db.fuels.reduce((a,x)=>a+Number(x.cost),0),totalMaint=db.maintenance.reduce((a,x)=>a+Number(x.cost),0),distance=db.trips.reduce((a,x)=>a+Number(x.distance||0),0),litres=db.fuels.reduce((a,x)=>a+Number(x.litres||0),0),revenue=db.trips.reduce((a,x)=>a+Number(x.revenue||0),0),roi=db.vehicles.reduce((a,v)=>{let cost=db.fuels.filter(x=>x.vehicleId===v.id).reduce((s,x)=>s+Number(x.cost),0)+db.maintenance.filter(x=>x.vehicleId===v.id).reduce((s,x)=>s+Number(x.cost),0);let rev=db.trips.filter(x=>x.vehicleId===v.id).reduce((s,x)=>s+Number(x.revenue||0),0);return a+(v.acquisition?(rev-cost)/v.acquisition:0)},0)/Math.max(db.vehicles.length,1)*100;return `<section class="grid kpis"><div class="card"><div class="kpi-label">Fuel efficiency</div><div class="kpi">${litres?(distance/litres).toFixed(1):'0'} km/L</div></div><div class="card"><div class="kpi-label">Fleet utilization</div><div class="kpi">${db.vehicles.length?Math.round(db.vehicles.filter(v=>v.status==='On Trip').length/db.vehicles.length*100):0}%</div></div><div class="card"><div class="kpi-label">Operational cost</div><div class="kpi">${money(totalFuel+totalMaint)}</div></div><div class="card"><div class="kpi-label">Revenue</div><div class="kpi">${money(revenue)}</div></div><div class="card"><div class="kpi-label">Average vehicle ROI</div><div class="kpi">${roi.toFixed(1)}%</div></div></section><section class="grid two"><div class="panel"><h2>Cost composition</h2>${[['Fuel',totalFuel],['Maintenance',totalMaint],['Other expenses',db.expenses.reduce((a,x)=>a+Number(x.amount),0)]].map(([n,x])=>`<div class="bar-row"><span>${n}</span><div class="bar"><i style="width:${(x/Math.max(totalFuel+totalMaint+1,1))*100}%"></i></div><b>${money(x)}</b></div>`).join('')}</div><div class="panel"><div class="split"><h2>Vehicle ROI</h2><button class="primary" data-action="export-csv">Export CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Vehicle</th><th>Distance</th><th>Fuel efficiency</th><th>ROI</th></tr></thead><tbody>${db.vehicles.map(v=>{let ts=db.trips.filter(t=>t.vehicleId===v.id),km=ts.reduce((a,t)=>a+Number(t.distance||0),0),l=db.fuels.filter(f=>f.vehicleId===v.id).reduce((a,f)=>a+Number(f.litres||0),0),cost=db.fuels.filter(f=>f.vehicleId===v.id).reduce((a,f)=>a+Number(f.cost),0)+db.maintenance.filter(m=>m.vehicleId===v.id).reduce((a,m)=>a+Number(m.cost),0),rev=ts.reduce((a,t)=>a+Number(t.revenue||0),0);return `<tr><td>${esc(v.reg)}</td><td>${km} km</td><td>${l?(km/l).toFixed(1):'0'} km/L</td><td>${v.acquisition?(((rev-cost)/v.acquisition)*100).toFixed(1):'0'}%</td></tr>`}).join('')}</tbody></table></div></div></section>`}
    function renderSettings(){setTitle('Settings','Profile, role access, and local application preferences');return `<section class="panel"><h2>Role-based access</h2><p class="muted">Current role: <b>${esc(session.role)}</b>. Permissions are enforced in the interface and dispatch rules remain active for every role.</p><div class="table-wrap"><table class="table"><thead><tr><th>Module</th><th>Access</th></tr></thead><tbody>${navItems.map(x=>`<tr><td>${x[2]}</td><td>${can(x[0])?badge('Allowed'):badge('Restricted')}</td></tr>`).join('')}</tbody></table></div><button class="secondary" data-action="reset-data" style="margin-top:16px">Reset demo data</button></section>`}
    function modal(title,body){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-box"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="modal-close">×</button></div>${body}</div>`;m.classList.remove('hidden');m.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action,b.dataset.id))}
    function vehicleForm(v={}){modal(v.id?'Edit vehicle':'Add vehicle',`<form id="vehicleForm" class="form-grid"><input type="hidden" name="id" value="${esc(v.id||'')}"><div class="field"><label>Registration number</label><input name="reg" required value="${esc(v.reg||'')}"></div><div class="field"><label>Model / vehicle name</label><input name="model" required value="${esc(v.model||'')}"></div><div class="field"><label>Type</label><select name="type">${['Bus','Truck','Van'].map(x=>`<option ${v.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Maximum load capacity (kg)</label><input name="capacity" type="number" min="1" required value="${esc(v.capacity||'')}"></div><div class="field"><label>Odometer (km)</label><input name="odometer" type="number" min="0" required value="${esc(v.odometer||0)}"></div><div class="field"><label>Acquisition cost (₹)</label><input name="acquisition" type="number" min="0" required value="${esc(v.acquisition||0)}"></div><div class="field"><label>Region</label><input name="region" required value="${esc(v.region||'Hyderabad')}"></div><div class="field"><label>Status</label><select name="status">${['Available','On Trip','In Shop','Retired'].map(x=>`<option ${v.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-actions wide"><button class="primary">Save vehicle</button></div></form>`)}
    function driverForm(d={}){modal(d.id?'Edit driver':'Add driver',`<form id="driverForm" class="form-grid"><input type="hidden" name="id" value="${esc(d.id||'')}"><div class="field"><label>Name</label><input name="name" required value="${esc(d.name||'')}"></div><div class="field"><label>License number</label><input name="license" required value="${esc(d.license||'')}"></div><div class="field"><label>License category</label><input name="category" required value="${esc(d.category||'Light Vehicle')}"></div><div class="field"><label>License expiry</label><input name="expiry" type="date" required value="${esc(d.expiry||'')}"></div><div class="field"><label>Contact number</label><input name="phone" required value="${esc(d.phone||'')}"></div><div class="field"><label>Safety score</label><input name="score" type="number" min="0" max="100" required value="${esc(d.score||80)}"></div><div class="field"><label>Status</label><select name="status">${['Available','On Trip','Off Duty','Suspended'].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-actions wide"><button class="primary">Save driver</button></div></form>`)}
    function formData(form){return Object.fromEntries(new FormData(form).entries())}
    function bind(view){if(view==='vehicles'){const f=()=>{let q=document.getElementById('vehicleSearch').value.toLowerCase(),t=document.getElementById('vehicleType').value,s=document.getElementById('vehicleStatus').value;document.getElementById('vehicleRows').innerHTML=vehicleRows(db.vehicles.filter(v=>(!q||(`${v.reg} ${v.model}`).toLowerCase().includes(q))&&(!t||v.type===t)&&(!s||v.status===s)))};['vehicleSearch','vehicleType','vehicleStatus'].forEach(id=>document.getElementById(id).addEventListener('input',f))}if(view==='drivers'){const f=()=>{let q=document.getElementById('driverSearch').value.toLowerCase(),s=document.getElementById('driverStatus').value;document.getElementById('driverRows').innerHTML=driverRows(db.drivers.filter(d=>(!q||(`${d.name} ${d.license}`).toLowerCase().includes(q))&&(!s||d.status===s)))};['driverSearch','driverStatus'].forEach(id=>document.getElementById(id).addEventListener('input',f))}document.getElementById('tripForm')?.addEventListener('submit',e=>{e.preventDefault();const x=formData(e.target),v=db.vehicles.find(a=>a.id===x.vehicleId),d=db.drivers.find(a=>a.id===x.driverId),w=Number(x.weight);if(!v||v.status!=='Available')return notify('Vehicle is no longer available.',false);if(!d||d.status!=='Available'||isExpired(d.expiry))return notify('Driver is unavailable or license is expired.',false);if(w>Number(v.capacity))return notify(`Cargo exceeds vehicle capacity of ${v.capacity} kg.`,false);db.trips.push({id:uid('t'),...x,weight:w,distance:Number(x.distance),status:'Dispatched',fuel:0,revenue:0});v.status='On Trip';d.status='On Trip';save();notify('Trip dispatched successfully.');route('trips')});document.getElementById('maintenanceForm')?.addEventListener('submit',e=>{e.preventDefault();const x=formData(e.target),v=db.vehicles.find(a=>a.id===x.vehicleId);db.maintenance.push({id:uid('m'),vehicleId:x.vehicleId,issue:x.issue,cost:Number(x.cost),date:x.date,status:'In Progress'});if(v&&v.status!=='Retired')v.status='In Shop';save();notify('Maintenance started; vehicle moved to In Shop.');route('maintenance')});document.getElementById('financeForm')?.addEventListener('submit',e=>{e.preventDefault();const x=formData(e.target);if(x.kind==='fuel')db.fuels.push({id:uid('f'),vehicleId:x.vehicleId,litres:Number(x.litres||0),cost:Number(x.amount),date:x.date,type:'Diesel'});else db.expenses.push({id:uid('e'),vehicleId:x.vehicleId,amount:Number(x.amount),date:x.date,type:x.type||'Other'});save();notify('Financial record saved.');route('finance')})}
    function actions(action,id){if(action==='modal-close'){document.getElementById('modal').classList.add('hidden');return}if(action==='vehicle-add')return vehicleForm();if(action==='vehicle-edit')return vehicleForm(db.vehicles.find(v=>v.id===id));if(action==='driver-add')return driverForm();if(action==='driver-edit')return driverForm(db.drivers.find(d=>d.id===id));if(action==='vehicle-retire'){let v=db.vehicles.find(x=>x.id===id);if(v.status==='On Trip'||v.status==='In Shop')return notify('Complete trip or maintenance before retiring.',false);v.status='Retired';save();notify('Vehicle retired.');return route('vehicles')}if(action==='trip-complete'||action==='trip-cancel'){let t=db.trips.find(x=>x.id===id);t.status=action==='trip-complete'?'Completed':'Cancelled';let v=db.vehicles.find(x=>x.id===t.vehicleId),d=db.drivers.find(x=>x.id===t.driverId);if(v&&v.status==='On Trip')v.status='Available';if(d&&d.status==='On Trip')d.status='Available';save();notify(`Trip ${t.status.toLowerCase()}.`);return route('trips')}if(action==='maintenance-close'){let m=db.maintenance.find(x=>x.id===id),v=db.vehicles.find(x=>x.id===m.vehicleId);m.status='Closed';if(v&&v.status!=='Retired')v.status='Available';save();notify('Maintenance closed; vehicle is available.');return route('maintenance')}if(action==='export-csv'){let rows=[['Vehicle','Distance (km)','Fuel litres','Fuel cost','Maintenance cost','ROI %']].concat(db.vehicles.map(v=>{let ts=db.trips.filter(t=>t.vehicleId===v.id),km=ts.reduce((a,t)=>a+Number(t.distance||0),0),l=db.fuels.filter(f=>f.vehicleId===v.id).reduce((a,f)=>a+Number(f.litres||0),0),fuel=db.fuels.filter(f=>f.vehicleId===v.id).reduce((a,f)=>a+Number(f.cost),0),m=db.maintenance.filter(x=>x.vehicleId===v.id).reduce((a,x)=>a+Number(x.cost),0),rev=ts.reduce((a,t)=>a+Number(t.revenue||0),0);return [v.reg,km,l,fuel,m,v.acquisition?((rev-fuel-m)/v.acquisition*100).toFixed(1):0]}));let blob=new Blob([rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='transitops-report.csv';a.click();URL.revokeObjectURL(a.href);return notify('CSV report downloaded.')}if(action==='reset-data'){db=structuredClone(seed);save();notify('Demo data reset.');route('settings')}}
    document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||password!=='12345'){document.getElementById('loginError').textContent='Use a valid email and the demo password 12345.';return}session={email,role:document.getElementById('loginRole').value};localStorage.setItem(SESSION,JSON.stringify(session));init()};document.getElementById('logout').onclick=()=>{localStorage.removeItem(SESSION);session=null;init()};
    init();
  </script>
